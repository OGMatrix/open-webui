# ─────────────────────────────────────────────────────────────────────────────
# Fork · Release
#
# One button, in order: merge upstream, work out the next version, write the
# changelog, build and publish the image, then tag and cut the GitHub release.
#
# The image is built *before* anything is tagged. A release pointing at an
# image that failed to build is worse than no release, so nothing is written to
# the repository until there is a published image to point it at.
#
# Versions are the upstream version plus a fork counter — 0.11.3-ogm.1 — and
# the counter is read back out of the existing tags. package.json is left
# alone on purpose: writing a fork version into the file upstream also edits
# would put a conflict in the way of every single upstream merge.
#
# Values from outside are handed to the shell through `env:` rather than pasted
# in by the expression engine. Release notes are made of commit subjects, and a
# subject with an apostrophe in it would otherwise end the quoting.
# ─────────────────────────────────────────────────────────────────────────────
# A boolean input is not reliably a boolean. Dispatched through the API — which
# is what `gh workflow run` does — it arrives as the string "false", and a
# non-empty string is true in an Actions expression. `!inputs.dry_run` therefore
# read as false on a run that had asked to publish, and the whole thing skipped
# itself while reporting success. Both readings are compared for, everywhere.

name: Fork · Release

on:
  workflow_dispatch:
    inputs:
      sync_upstream:
        description: 'Merge upstream first'
        type: boolean
        default: true
      upstream_branch:
        description: 'Upstream branch to merge from'
        type: choice
        options: [dev, main]
        default: dev
      version:
        description: 'Version to release (blank = next counter on the current upstream version)'
        type: string
        default: ''
      latest:
        description: 'Publish the image as :latest too'
        type: boolean
        default: true
      dry_run:
        description: 'Show the version and changelog for live as it stands; change nothing anywhere'
        type: boolean
        default: false

# The reusable workflows called below are capped by what is granted here.
permissions:
  contents: write
  packages: write
  pull-requests: write

concurrency:
  group: fork-release
  cancel-in-progress: false

jobs:
  # ── 1. Bring the fork up to date, if asked ─────────────────────────────────
  sync:
    # A dry run changes nothing, and merging upstream into `live` would change
    # something — so the sync sits out, and what gets previewed is `live` as it
    # stands today rather than as it would be afterwards.
    if: >-
      ${{ (inputs.sync_upstream == true || inputs.sync_upstream == 'true')
          && inputs.dry_run != true && inputs.dry_run != 'true' }}
    uses: ./.github/workflows/fork-sync-upstream.yml
    with:
      upstream_branch: ${{ inputs.upstream_branch }}
      run_checks: true
    secrets: inherit

  # ── 2. Decide what this release is called and what is in it ────────────────
  prepare:
    needs: sync
    # `sync` is skipped when the merge was not wanted; that is not a failure.
    if: ${{ always() && !cancelled() && (needs.sync.result == 'success' || needs.sync.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
      base: ${{ steps.version.outputs.base }}
      notes: ${{ steps.notes.outputs.notes }}
      publish: ${{ steps.mode.outputs.publish }}

    steps:
      - name: Decide whether this run publishes
        id: mode
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # Settled here, in a shell, and passed on as a word.
          #
          # Deciding it in an expression did not work: a boolean input arrives
          # from the API as a string, the coercion rules around that are not
          # obvious, and a condition that reads wrong makes a job skip — which
          # a run reports as success. In a shell "false" is just a string, and
          # comparing it is the whole of the logic.
          if [ "${DRY_RUN}" = 'true' ]; then
            echo "publish=no" >> "$GITHUB_OUTPUT"
            echo "dry run: nothing will be published"
          else
            echo "publish=yes" >> "$GITHUB_OUTPUT"
            echo "this run publishes"
          fi

      - name: Check out the fork
        uses: actions/checkout@v5
        with:
          ref: live
          # Tags and full history: the version counter and the changelog are
          # both read out of them.
          fetch-depth: 0

      - name: Fetch upstream
        env:
          UPSTREAM_BRANCH: ${{ inputs.upstream_branch }}
        run: |
          # The changelog tells our commits from upstream's by asking which are
          # reachable from upstream, so upstream has to be here to ask.
          git remote add upstream https://github.com/open-webui/open-webui.git 2>/dev/null || true
          git fetch upstream --quiet "${UPSTREAM_BRANCH}"

      - name: Work out the version
        id: version
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          BASE=$(jq -r '.version' package.json)

          if [ -n "${REQUESTED}" ]; then
            VERSION="${REQUESTED}"
            # It becomes a git tag and an image tag, so it has to be usable as
            # both, and it is typed by hand.
            case "${VERSION}" in
              *[!A-Za-z0-9._-]*) echo "::error::not a usable version: ${VERSION}"; exit 1 ;;
            esac
          else
            VERSION=$(python scripts/fork-release.py version)
          fi

          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "::error::tag v${VERSION} already exists"
            exit 1
          fi

          {
            echo "version=${VERSION}"
            echo "base=${BASE}"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
          echo "releasing ${VERSION}, built on upstream ${BASE}"

      - name: Write the changelog entry
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          UPSTREAM_BRANCH: ${{ inputs.upstream_branch }}
        run: |
          python scripts/fork-release.py notes \
            --version "${VERSION}" \
            --upstream "upstream/${UPSTREAM_BRANCH}" > "${RUNNER_TEMP}/notes.md"

          {
            echo "notes<<FORK_RELEASE_NOTES"
            cat "${RUNNER_TEMP}/notes.md"
            echo "FORK_RELEASE_NOTES"
          } >> "$GITHUB_OUTPUT"

      # Built here and carried to the image job rather than committed, so the
      # image can ship a changelog that names itself while nothing is written
      # down until the image actually exists.
      - name: Prepare the changelog the image will carry
        run: python scripts/fork-release.py insert --notes "${RUNNER_TEMP}/notes.md"

      - name: Hand it to the image build
        uses: actions/upload-artifact@v4
        with:
          name: fork-changelog-${{ github.run_id }}
          path: CHANGELOG-FORK.md
          retention-days: 1
          if-no-files-found: error

      - name: Preview
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          {
            [ "${DRY_RUN}" = 'true' ] && echo "> Dry run — nothing was published." && echo
            cat "${RUNNER_TEMP}/notes.md"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── 3. Build and publish the image, before anything is written down ────────
  image:
    needs: prepare
    # `!cancelled()` keeps this out of the skip that propagates down a needs
    # chain, so the success of the job before it has to be asked for outright.
    if: >-
      ${{ !cancelled() && needs.prepare.result == 'success'
          && needs.prepare.outputs.publish == 'yes' }}
    uses: ./.github/workflows/fork-docker.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      version: ${{ needs.prepare.outputs.version }}
      changelog_artifact: fork-changelog-${{ github.run_id }}
      # Compared rather than forwarded: the called workflow declares this a
      # boolean, and a string would either be coerced behind our back or
      # rejected. A comparison is a boolean whatever came in.
      latest: ${{ inputs.latest == true || inputs.latest == 'true' }}
    secrets: inherit

  # ── 4. Only now: changelog, tag, release ──────────────────────────────────
  release:
    needs: [prepare, image]
    if: >-
      ${{ !cancelled() && needs.image.result == 'success'
          && needs.prepare.outputs.publish == 'yes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the fork
        uses: actions/checkout@v5
        with:
          ref: live
          fetch-depth: 0

      - name: Identify the committer
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      # The same insertion the image was built with, so the committed file and
      # the one inside the image cannot disagree.
      - name: Insert the entry into CHANGELOG-FORK.md
        env:
          NOTES: ${{ needs.prepare.outputs.notes }}
        run: printf '%s\n' "${NOTES}" | python scripts/fork-release.py insert --notes -

      - name: Commit, tag and push
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          git add CHANGELOG-FORK.md
          git commit -m "chore(release): ${VERSION}"
          git tag -a "v${VERSION}" -m "Fork release ${VERSION}"
          git push origin HEAD:live
          git push origin "refs/tags/v${VERSION}"

      - name: Assemble the release notes
        env:
          NOTES: ${{ needs.prepare.outputs.notes }}
          IMAGE: ${{ needs.image.outputs.image }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
          BUILT_FROM: ${{ needs.prepare.outputs.sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
          BASE: ${{ needs.prepare.outputs.base }}
        run: |
          {
            printf '%s\n\n' "${NOTES}"

            echo '## Container image'
            echo
            echo '```bash'
            echo "docker pull ${IMAGE}"
            echo '```'
            echo
            echo "Built from \`${BUILT_FROM}\` for \`linux/amd64\`, digest \`${IMAGE_DIGEST}\`."
            echo
            echo 'In TrueNAS: Apps → Discover Apps → Custom App, image repository'
            echo "\`${IMAGE%:*}\`, tag \`${VERSION}\`. Container port 8080, and"
            echo "persist \`/app/backend/data\` to a dataset."
            echo

            echo '## Notice'
            echo
            echo 'This is an **unofficial fork** of Open WebUI. It is not affiliated'
            echo 'with, endorsed by, or maintained by the official Open WebUI team.'
            echo 'Report anything you find here to this repository, not upstream.'
            echo
            echo "Built on Open WebUI \`${BASE}\`. Copyright (c) 2023- Open WebUI Inc."
            echo '[Created by Timothy Jaeryang Baek]. Distributed under the Open WebUI'
            echo "License; \`LICENSE\`, \`LICENSE_HISTORY\` and \`LICENSE_NOTICE\` travel with"
            echo "the source and ship inside the image under \`/app\`, and \`NOTICE-FORK.md\`"
            echo 'records what this fork changes. Open WebUI branding is left exactly as'
            echo 'upstream ships it.'
          } > "${RUNNER_TEMP}/release-notes.md"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          LATEST: ${{ inputs.latest == true || inputs.latest == 'true' }}
        run: |
          gh release create "v${VERSION}" \
            --title "${VERSION}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md" \
            --latest="${LATEST}"

      - name: Report
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          BASE: ${{ needs.prepare.outputs.base }}
          IMAGE: ${{ needs.image.outputs.image }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ needs.prepare.outputs.version }}
        run: |
          {
            echo "### Released"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Version | \`${VERSION}\` |"
            echo "| Upstream base | \`${BASE}\` |"
            echo "| Image | \`${IMAGE}\` |"
            echo "| Release | ${RELEASE_URL} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── 5. A run that published nothing must not report success ───────────────
  verify:
    needs: [prepare, image, release]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check that the release actually happened
        env:
          PUBLISH: ${{ needs.prepare.outputs.publish }}
          PREPARE: ${{ needs.prepare.result }}
          IMAGE: ${{ needs.image.result }}
          RELEASE: ${{ needs.release.result }}
        run: |
          # This job exists because of a run that went green having done
          # nothing: a condition misread its own input and every publishing
          # job skipped itself. A skip is invisible in the run's own verdict,
          # so something has to look at the result and object.
          if [ "${PUBLISH}" != 'yes' ]; then
            echo "dry run: nothing was meant to be published"
            exit 0
          fi

          fail=0
          for pair in "prepare:${PREPARE}" "image:${IMAGE}" "release:${RELEASE}"; do
            name="${pair%%:*}"
            result="${pair#*:}"
            if [ "${result}" != 'success' ]; then
              echo "::error::${name} did not succeed (${result}); nothing was published"
              fail=1
            fi
          done
          if [ "${fail}" -ne 0 ]; then
            exit 1
          fi
          echo "image and release both succeeded"
