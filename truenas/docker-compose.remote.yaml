# =============================================================================
# Open WebUI (Fork) — Remote Ollama / API Server
# =============================================================================
# Use this when Ollama or another LLM server runs on a different machine.
#
# Deploy: Apps → Discover Apps → Custom App → Install via YAML
# =============================================================================

services:
  open-webui:
    image: ghcr.io/ogmatrix/open-webui:0.11.3-ogm.1
    container_name: open-webui
    ports:
      - "8080:8080"
    volumes:
      - /mnt/<pool>/apps/open-webui:/app/backend/data
    environment:
      # Point to your remote Ollama or OpenAI-compatible server
      - OLLAMA_BASE_URL=http://<OLLAMA_HOST_IP>:11434
      - OPENAI_API_BASE_URL=
      - OPENAI_API_KEY=
      - WEBUI_SECRET_KEY=
      - SCARF_NO_ANALYTICS=true
      - DO_NOT_TRACK=true
      - ANONYMIZED_TELEMETRY=false
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
